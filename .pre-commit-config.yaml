# Pre-commit hooks for Repricer-Ozon
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # ruff - fast Python linter (replaces flake8, isort, pyupgrade, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy - static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic
          - pydantic-settings
          - sqlalchemy
          - httpx
          - openpyxl
          - pandas
          - pytest
          - pytest-asyncio
          - structlog
          - filelock
          - types-pytz
        args: [--config-file=pyproject.toml, --exclude=numpy]

  # Check for common issues
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: requirements-txt-fixer
      - id: detect-private-key

  # Check for secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks

# CI configuration for GitHub Actions
ci:
  autofix_commit_msg: "style: pre-commit auto-fixes"
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "chore: pre-commit auto-update"
  autoupdate_schedule: weekly
  skip: [mypy]  # Skip mypy in CI for speed, run separately
