# alembic.ini
# Configuration for Alembic migrations.
# The sqlalchemy.url is dynamically set in migrations/env.py based on INSTANCE_NAME.
# This fallback is only used if env.py is not loaded (e.g., `alembic init`).
# Set your instance-specific path via .env: DATABASE_PATH=./data/repricer_{{INSTANCE_NAME}}.db

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url = sqlite:///./data/repricer_{{INSTANCE_NAME}}.db  # Overridden at runtime by migrations/env.py

[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 88

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S