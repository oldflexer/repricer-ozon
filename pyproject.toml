[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ozon-repricer"
version = "1.0.0"
description = "Automated price management for Ozon marketplace"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ivan Melentyev aka old_flexer"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-dotenv==1.2.2",
    "pydantic-settings==2.14.1",
    "alembic==1.18.5",
    "pandas==3.0.2",
    "openpyxl==3.1.5",
    "httpx==0.28.1",
    "structlog==25.5.0",
    "streamlit==1.56.0",
    "pytz==2026.1.post1",
    "plotly==6.7.0",
    "undetected-chromedriver==3.5.5",
    "webdriver-manager==4.1.2",
    "selenium==4.46.0",
    "filelock==3.32.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-mock==3.15.1",
    "pytest-httpx==0.36.2",
    "mypy==2.3.0",
    "ruff==0.16.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "infrastructure*", "config*", "scripts*", "ui*", "migrations*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "PTH", # flake8-use-pathlib
    "PL",  # pylint
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "ERA", # eradicate
    "LOG", # flake8-logging-format
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "PLW0603", # global variable used
    "T201", # print (allowed in scripts)
]
per-file-ignores = { "scripts/*" = ["T201"], "tests/*" = ["S101", "T201", "PLR2004", "PLC0415", "ARG001", "ARG002"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
strict_optional = false
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true

# Exclude pre-commit cache and virtual environment directories
exclude = [
    ".venv",
    ".cache",
    "site-packages",
    "pre-commit",
    "numpy",
]

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["core", "infrastructure", "scripts", "config", "ui"]
omit = ["tests/*", "migrations/*", "scripts/health_check.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

