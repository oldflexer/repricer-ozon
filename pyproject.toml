[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ozon-repricer"
version = "1.0.0"
description = "Automated price management for Ozon marketplace"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ivan Melentyev aka old_flexer"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.14.1",
    "alembic>=1.18.5",
    "pandas>=3.0.2",
    "openpyxl>=3.1.5",
    "httpx>=0.28.1",
    "structlog>=25.5.0",
    "streamlit>=1.56.0",
    "pytz>=2026.1",
    "plotly>=6.7.0",
    "undetected-chromedriver>=3.5.5",
    "webdriver-manager>=4.1.2",
    "selenium>=4.46.0",
    "filelock>=3.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "pytest-httpx>=0.36.2",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "infrastructure*", "config*", "scripts*", "ui*", "migrations*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true